services:
  - type: web
    name: scopeline-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MODEL_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-3.5-flash-lite
      - key: ALLOWED_MODELS
        value: local-scripted,gemini-3.1-flash-lite,gemini-3.5-flash-lite,groq/qwen3.8-27b
      - key: ENABLE_LIVE_MODELS
        value: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SPEND_LIMIT_USD
        value: 0
      - key: MAX_LIVE_REQUESTS_PER_MINUTE
        value: 10
      - key: GROQ_API_KEY
        sync: false
      - key: FALLBACK_MODELS
        value: groq/qwen3.8-27b
      - key: ALLOW_MODEL_FALLBACK
        value: false
      - key: ALLOW_LOCAL_FALLBACK
        value: false
      - key: DIRECT_API_FREE_TIER
        value: true
      - key: MODEL_TIMEOUT_SECONDS
        value: 10
