services:
  - type: web
    name: scopeline-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MODEL_PROVIDER
        value: openrouter
      - key: MODEL_NAME
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: ALLOWED_MODELS
        value: local-scripted,nvidia/nemotron-3-ultra-550b-a55b:free,cohere/north-mini-code:free
      - key: ENABLE_LIVE_MODELS
        value: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SPEND_LIMIT_USD
        value: 0
      - key: MAX_LIVE_REQUESTS_PER_MINUTE
        value: 10
